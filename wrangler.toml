name = "chatbot-assistant-api"
main = "worker/index.js"
compatibility_date = "2026-04-04"
workers_dev = true

[observability]
enabled = true

[vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://jasonpengdevsite.shuangzp.workers.dev"
AI_PROVIDER = "openai"
OPENAI_MODEL = "gpt-4.1-mini"
ANTHROPIC_MODEL = "claude-3-5-sonnet-latest"
MAX_OUTPUT_TOKENS = "350"
RATE_LIMIT_WINDOW_MS = "60000"
RATE_LIMIT_MAX_REQUESTS = "12"
RATE_LIMIT_MIN_INTERVAL_MS = "1200"
UNTRUSTED_RATE_LIMIT_MAX_REQUESTS = "4"
DUPLICATE_MESSAGE_THRESHOLD = "3"
ALLOWED_SOURCES = "portfolio-widget,worker-test"
TURNSTILE_REQUIRED = "false"

[env.preview]
workers_dev = true

[env.preview.vars]
APP_ENV = "preview"
ALLOWED_ORIGINS = "https://jasonpengdevsite.shuangzp.workers.dev"
AI_PROVIDER = "openai"
OPENAI_MODEL = "gpt-4.1-mini"
ANTHROPIC_MODEL = "claude-3-5-sonnet-latest"
MAX_OUTPUT_TOKENS = "350"
RATE_LIMIT_WINDOW_MS = "60000"
RATE_LIMIT_MAX_REQUESTS = "12"
RATE_LIMIT_MIN_INTERVAL_MS = "1200"
UNTRUSTED_RATE_LIMIT_MAX_REQUESTS = "4"
DUPLICATE_MESSAGE_THRESHOLD = "3"
ALLOWED_SOURCES = "portfolio-widget,worker-test"
TURNSTILE_REQUIRED = "false"
